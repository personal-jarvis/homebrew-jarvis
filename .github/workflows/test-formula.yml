name: test-formula

# Runs `brew audit --strict` against every Formula in this tap on every
# push and pull request. A Formula that fails audit must not land on main —
# users would see the failure at `brew install` time, which defeats the
# Wave 4 trust model (the tap is supposed to be the *clean* install path).
#
# The setup-homebrew action is pinned to a 40-character commit SHA, not a
# tag/branch, so a compromise of the Homebrew/actions repo cannot
# retroactively change what this workflow runs. SA-W4-5 (Wave 4 integrator)
# bumps the SHA when reviewing each release.

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/test-formula.yml"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/test-formula.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: brew audit --strict
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91

      - name: Stage tap inside Homebrew taps tree (so `brew audit NAME` resolves)
        # NOTE (SA-5, 2026-05-27): `brew audit <path>` is disabled in
        # Homebrew 4.x ("Use brew audit [name ...] instead"). We cannot
        # simply `brew tap personal-jarvis/jarvis <local-path>` because
        # setup-homebrew has already implicitly tapped from the public
        # GitHub URL — `brew tap` then refuses with "remote mismatch".
        # Instead, copy the workspace into the canonical taps location
        # so brew already knows the tap is `personal-jarvis/jarvis` and
        # `brew audit personal-jarvis/jarvis/<name>` resolves to the
        # files we just checked out.
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/personal-jarvis/homebrew-jarvis"
          mkdir -p "$(dirname "$TAP_DIR")"
          if [ -d "$TAP_DIR" ]; then
            rm -rf "$TAP_DIR"
          fi
          cp -R "${{ github.workspace }}" "$TAP_DIR"
          ls -la "$TAP_DIR/Formula"

      - name: Audit Formula (strict)
        run: |
          set -euo pipefail
          shopt -s nullglob
          formulae=(Formula/*.rb)
          if [ ${#formulae[@]} -eq 0 ]; then
            echo "::error::No Formula files found under Formula/"
            exit 1
          fi
          for f in "${formulae[@]}"; do
            name=$(basename "$f" .rb)
            echo "::group::brew audit --strict --online $name"
            brew audit --strict --online "personal-jarvis/jarvis/$name"
            echo "::endgroup::"
          done

      - name: Style check (brew style)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            echo "::group::brew style $name"
            brew style "personal-jarvis/jarvis/$name"
            echo "::endgroup::"
          done
